<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>43 Months</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,500&family=Jost:wght@300;400;500&display=swap');

  :root{
    --ink: #f3e9e4;
    --ink-dim: #cbb9c4;
    --night-1: #0c0715;
    --night-2: #170c22;
    --night-3: #23102c;
    --rose-1: #ff6f91;
    --rose-2: #ff9ecb;
    --rose-3: #c93c6b;
    --gold: #d8ad6d;
  }

  *{ box-sizing: border-box; }

  html, body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    background: var(--night-1);
    overflow: hidden;
    font-family: 'Jost', sans-serif;
  }

  #sky{
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    background:
      radial-gradient(ellipse at 50% 120%, var(--night-3) 0%, var(--night-2) 45%, var(--night-1) 100%);
    display:block;
  }

  #stars{
    position: fixed;
    inset:0;
    width:100%;
    height:100%;
    pointer-events:none;
  }

  .horizon{
    position: fixed;
    left:0; right:0; bottom:0;
    height: 26vh;
    background: linear-gradient(to top, rgba(5,2,10,0.9), rgba(5,2,10,0));
    pointer-events: none;
  }

  .content{
    position: fixed;
    inset:0;
    display:flex;
    flex-direction: column;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding: 24px;
    pointer-events:none;
  }

  .eyebrow-line{
    width: 44px;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--gold), transparent);
    margin-bottom: 22px;
    opacity: 0;
    animation: fadeIn 1.6s ease forwards 0.4s;
  }

  .count{
    font-family: 'Cormorant Garamond', serif;
    font-weight: 500;
    font-style: italic;
    font-size: clamp(3.2rem, 12vw, 7.5rem);
    line-height: 0.95;
    color: var(--ink);
    margin: 0;
    letter-spacing: 0.01em;
    text-shadow: 0 0 40px rgba(255,143,171,0.25);
    opacity: 0;
    animation: fadeUp 1.8s cubic-bezier(.16,1,.3,1) forwards 0.7s;
  }

  .count em{
    font-style: normal;
    color: var(--rose-2);
  }

  .subline{
    font-family: 'Jost', sans-serif;
    font-weight: 300;
    font-size: clamp(0.95rem, 2vw, 1.15rem);
    letter-spacing: 0.14em;
    color: var(--ink-dim);
    margin-top: 18px;
    text-transform: uppercase;
    opacity: 0;
    animation: fadeIn 1.8s ease forwards 1.5s;
  }

  .message{
    max-width: 560px;
    margin-top: 34px;
    font-family: 'Cormorant Garamond', serif;
    font-size: clamp(1.15rem, 2.4vw, 1.5rem);
    line-height: 1.6;
    color: var(--ink);
    opacity: 0;
    animation: fadeIn 1.8s ease forwards 2s;
  }

  .signature{
    margin-top: 28px;
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-size: 1.2rem;
    color: var(--gold);
    opacity: 0;
    animation: fadeIn 1.8s ease forwards 2.4s;
  }

  .hint{
    position: fixed;
    bottom: 28px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 0.75rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--ink-dim);
    opacity: 0;
    animation: fadeIn 2s ease forwards 3s, pulse 2.4s ease-in-out infinite 4s;
    pointer-events: none;
  }

  @keyframes fadeIn{
    to{ opacity: 1; }
  }
  @keyframes fadeUp{
    from{ opacity: 0; transform: translateY(18px); }
    to{ opacity: 1; transform: translateY(0); }
  }
  @keyframes pulse{
    0%, 100%{ opacity: 0.55; }
    50%{ opacity: 1; }
  }

  @media (prefers-reduced-motion: reduce){
    .count, .subline, .message, .signature, .eyebrow-line, .hint{
      animation: none !important;
      opacity: 1 !important;
      transform: none !important;
    }
  }
</style>
</head>
<body>

<canvas id="sky"></canvas>
<canvas id="stars"></canvas>
<div class="horizon"></div>

<div class="content">
  <div class="eyebrow-line"></div>
  <h1 class="count">forty<em>-</em>three months</h1>
  <div class="subline">of us</div>
  <p class="message">
    Every burst of light fades in seconds — what we've built hasn't.
    Here's to every month that got us here, and to all the ones still
    waiting to happen.
  </p>
  <div class="signature">I love you.</div>
</div>

<div class="hint">tap anywhere to light the sky</div>

<script>
(function(){
  const skyCanvas = document.getElementById('sky');
  const starCanvas = document.getElementById('stars');
  const skyCtx = skyCanvas.getContext('2d');
  const starCtx = starCanvas.getContext('2d');

  let W, H, DPR;
  function resize(){
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;
    [skyCanvas, starCanvas].forEach(c=>{
      c.width = W * DPR;
      c.height = H * DPR;
      c.style.width = W + 'px';
      c.style.height = H + 'px';
    });
    skyCtx.setTransform(DPR,0,0,DPR,0,0);
    starCtx.setTransform(DPR,0,0,DPR,0,0);
    drawStars();
  }

  // ---------- Background stars (static, drawn once per resize) ----------
  let stars = [];
  function drawStars(){
    stars = [];
    const count = Math.floor((W*H)/9000);
    for(let i=0;i<count;i++){
      stars.push({
        x: Math.random()*W,
        y: Math.random()*H*0.75,
        r: Math.random()*1.2 + 0.2,
        tw: Math.random()*Math.PI*2
      });
    }
  }

  function renderStars(t){
    starCtx.clearRect(0,0,W,H);
    for(const s of stars){
      const flicker = 0.5 + 0.5*Math.sin(t*0.001 + s.tw);
      starCtx.globalAlpha = 0.25 + flicker*0.5;
      starCtx.fillStyle = '#f6ecff';
      starCtx.beginPath();
      starCtx.arc(s.x, s.y, s.r, 0, Math.PI*2);
      starCtx.fill();
    }
    starCtx.globalAlpha = 1;
  }

  // ---------- Rose-curve firework ----------
  // A firework whose particles are seeded along a mathematical rose
  // curve r = cos(k*theta), so the explosion itself resembles a rose.

  const palettes = [
    ['#ff6f91','#ff9ecb','#ffd6e6'],
    ['#e0507a','#ff8fab','#fff0f3'],
    ['#d8ad6d','#ffcf8a','#fff3d6'],
    ['#c93c6b','#ff7aa8','#ffe3ee']
  ];

  class Particle{
    constructor(x, y, tx, ty, color, isCore){
      this.x = x; this.y = y;
      this.sx = x; this.sy = y;
      this.tx = tx; this.ty = ty;
      this.color = color;
      this.life = 1;
      this.decay = 0.006 + Math.random()*0.006;
      this.progress = 0;
      this.speed = 0.045 + Math.random()*0.02;
      this.gravity = 0;
      this.isCore = isCore;
      this.size = isCore ? (1.4 + Math.random()*1.2) : (1 + Math.random()*1.4);
      this.settled = false;
      this.vx = 0; this.vy = 0;
    }
    update(){
      if(this.progress < 1){
        this.progress += this.speed;
        const p = easeOutCubic(Math.min(this.progress,1));
        this.x = this.sx + (this.tx - this.sx)*p;
        this.y = this.sy + (this.ty - this.sy)*p;
        if(this.progress >= 1){
          this.vx = (this.tx - this.sx) * 0.004;
          this.vy = (this.ty - this.sy) * 0.004;
        }
      } else {
        this.gravity += 0.012;
        this.x += this.vx;
        this.y += this.vy + this.gravity;
        this.vx *= 0.98;
        this.life -= this.decay;
      }
    }
    draw(ctx){
      const alpha = this.progress < 1 ? Math.min(1, this.progress*2) : Math.max(this.life,0);
      if(alpha <= 0) return;
      ctx.globalAlpha = alpha;
      ctx.fillStyle = this.color;
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.size, 0, Math.PI*2);
      ctx.fill();
    }
    get dead(){
      return this.progress >= 1 && this.life <= 0;
    }
  }

  function easeOutCubic(x){
    return 1 - Math.pow(1-x, 3);
  }

  class Firework{
    constructor(x, y, scale, colorSet){
      this.particles = [];
      this.trail = { x, y, y0: window.innerHeight + 20, progress: 0, done:false };
      this.tx = x; this.ty = y;
      this.scale = scale;
      this.colorSet = colorSet;
      this.exploded = false;
    }
    explode(){
      this.exploded = true;
      const petals = 5; // k -> odd k gives k petals
      const pointsPerPetal = 26;
      const layers = 2;

      for(let layer=0; layer<layers; layer++){
        const layerScale = this.scale * (0.55 + layer*0.5);
        const colorSet = this.colorSet;
        for(let p=0; p<petals; p++){
          for(let i=0; i<pointsPerPetal; i++){
            const theta = (i/pointsPerPetal) * Math.PI + (p * Math.PI / petals);
            // rose curve r = cos(k*theta), k=5 for 5 petals (k odd -> k petals)
            const k = petals;
            const r = Math.cos(k*theta) * layerScale;
            const rr = Math.abs(r);
            const jitter = (Math.random()-0.5)*layerScale*0.06;
            const tx = this.tx + Math.cos(theta) * (rr+jitter);
            const ty = this.ty + Math.sin(theta) * (rr+jitter) * 0.92; // slight vertical compression for rose look
            const color = colorSet[Math.floor(Math.random()*colorSet.length)];
            this.particles.push(new Particle(this.tx, this.ty, tx, ty, color, layer===0));
          }
        }
      }
      // soft core glow particles
      for(let i=0;i<18;i++){
        const angle = Math.random()*Math.PI*2;
        const dist = Math.random()*this.scale*0.15;
        const tx = this.tx + Math.cos(angle)*dist;
        const ty = this.ty + Math.sin(angle)*dist;
        this.particles.push(new Particle(this.tx, this.ty, tx, ty, '#fff6f2', true));
      }
    }
    update(){
      if(!this.exploded){
        this.trail.progress += 0.045;
        if(this.trail.progress >= 1){
          this.explode();
        }
      } else {
        this.particles.forEach(p=>p.update());
        this.particles = this.particles.filter(p=>!p.dead);
      }
    }
    draw(ctx){
      if(!this.exploded){
        const p = easeOutCubic(this.trail.progress);
        const y = this.trail.y0 + (this.ty - this.trail.y0)*p;
        ctx.globalAlpha = 0.9;
        ctx.fillStyle = '#fff3e6';
        ctx.beginPath();
        ctx.arc(this.tx, y, 2.2, 0, Math.PI*2);
        ctx.fill();
        // spark trail
        ctx.globalAlpha = 0.25;
        ctx.beginPath();
        ctx.arc(this.tx, y+6, 1.4, 0, Math.PI*2);
        ctx.fill();
      } else {
        this.particles.forEach(p=>p.draw(ctx));
      }
      ctx.globalAlpha = 1;
    }
    get finished(){
      return this.exploded && this.particles.length === 0;
    }
  }

  let fireworks = [];

  function spawnFirework(x, y){
    const scale = Math.min(W,H) * (0.14 + Math.random()*0.08);
    const colorSet = palettes[Math.floor(Math.random()*palettes.length)];
    const targetY = y !== undefined ? y : (H*0.22 + Math.random()*H*0.28);
    const targetX = x !== undefined ? x : (W*0.2 + Math.random()*W*0.6);
    fireworks.push(new Firework(targetX, targetY, scale, colorSet));
  }

  // Ambient autoplay
  let lastAuto = 0;
  function maybeAutoSpawn(t){
    if(t - lastAuto > 1900 + Math.random()*1400){
      lastAuto = t;
      spawnFirework();
    }
  }

  // Interaction
  function onTap(e){
    const x = e.touches ? e.touches[0].clientX : e.clientX;
    const y = e.touches ? e.touches[0].clientY : e.clientY;
    spawnFirework(x, Math.min(y, H*0.55));
  }
  window.addEventListener('click', onTap);
  window.addEventListener('touchstart', onTap, {passive:true});

  // Main loop
  function loop(t){
    skyCtx.clearRect(0,0,W,H);

    // faint trailing fade for glow effect
    skyCtx.fillStyle = 'rgba(12,7,21,0.18)';
    skyCtx.fillRect(0,0,W,H);

    renderStars(t);

    maybeAutoSpawn(t);

    fireworks.forEach(f=>{ f.update(); f.draw(skyCtx); });
    fireworks = fireworks.filter(f=>!f.finished);

    requestAnimationFrame(loop);
  }

  window.addEventListener('resize', resize);
  resize();

  // kick off with a couple of welcoming bursts
  setTimeout(()=>spawnFirework(), 500);
  setTimeout(()=>spawnFirework(), 1400);

  requestAnimationFrame(loop);
})();
</script>

</body>
</html>
